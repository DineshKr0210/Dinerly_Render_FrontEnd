<section class="offers-page">

  <div class="offers-heading">
    <p>MEMBER OFFERS</p>
    <h1>Save more when you dine</h1>
  </div>

  <div class="offers-grid">

    <article
      class="offer-card"
      *ngFor="let offer of offers"
    >

      <div
        class="offer-visual"
      >
        <span>
          {{ offer.value }}
        </span>
      </div>

      <div class="offer-body">

        <small>
          {{ offer.restaurantName }}
        </small>

        <h3>
          {{ offer.name }}
        </h3>

        <!-- <p>
          {{ offer.description }}
        </p> -->

        <div class="offer-footer">
          <span>
            Valid until
            {{ offer.endDate }}
          </span>

          <!-- <button
            type="button"
            (click)="redeemOffer(offer)"
          >
            Redeem
          </button> -->
        </div>

      </div>

    </article>

  </div>

</section>
