<div class="session-overlay" *ngIf="idleTimeout.showWarning">
  <div class="session-modal" role="alertdialog" aria-modal="true" aria-labelledby="session-title">
    <div class="session-icon">
      <span>!</span>
    </div>
    <h2 id="session-title">Are you still there?</h2>
    <p>Your session has been inactive for 5 minutes.</p>
    <p class="session-message">For your security, you will be logged out in</p>
    <div class="countdown">{{ idleTimeout.remainingSeconds }} seconds</div>
    <p class="session-question">Would you like to continue your session?</p>
    <div class="session-actions">
      <button type="button" class="continue-btn" (click)="continueSession()">Yes, Continue</button>
      <button type="button" class="logout-btn" (click)="logout()">Log Out</button>
    </div>
  </div>
</div>
